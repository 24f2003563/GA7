name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: TDS identity: 24f2003563@ds.study.iitm.ac.in
        run: echo "identity step"

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: npm start &

      - name: Run tests against /release-gate
        run: |
          sleep 3
          curl -X POST http://localhost:3000/release-gate \
            -H "Content-Type: application/json" \
            -d '{"target":"preview", ... }'
