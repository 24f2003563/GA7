name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 24f2003563@ds.study.iitm.ac.in"
        run: echo "identity marker step"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -v

      - name: Start server
        run: |
          nohup python app.py > server.log 2>&1 &
          sleep 3

      - name: Smoke test the running endpoint
        run: |
          curl -sf -X POST http://localhost:5000/release-gate \
            -H "Content-Type: application/json" \
            -d '{
              "target": "preview",
              "event": "pull_request",
              "ref": "refs/heads/test",
              "workflow": {
                "trigger": "pull_request",
                "permissions": {"contents":"read","packages":"write","id-token":"none"},
                "testsPassed": true,
                "matrixComplete": true,
                "failFast": false,
                "actions": [{"owner":"actions","name":"checkout","ref":"v4"}]
              },
              "image": {
                "multiStage": true,
                "runsAsRoot": false,
                "secretMode": "none",
                "criticalVulnerabilities": 0,
                "digestPinned": true
              }
            }' | tee response.json
          grep -q '"decision":"promote"' response.json
