name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: TDS identity: 24f2003563@ds.study.iitm.ac.in
        run: echo "TDS identity: 24f2003563@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run release gate tests
        run: pytest
